# =============================================================================
# 웹툰 기업 실적 트래커 설정 파일
# - 종목을 추가하려면 companies 아래에 블록을 하나 더 만들면 됩니다.
# - API 키는 절대 이 파일에 쓰지 말고 GitHub Secrets(환경변수)로 주입합니다.
#     NAVER_CLIENT_ID / NAVER_CLIENT_SECRET / DART_API_KEY
# =============================================================================

db_path: data/tracker.db
backfill_start: "2022-01-01"     # 네이버 데이터랩 백필 시작일 (계절성 계수 산출용)
request_sleep_sec: 1.5           # 외부 요청 간 대기 시간
http_timeout_sec: 20

# 네이버 데이터랩(검색어 트렌드) API
#   hub    : NAVER API HUB(네이버 클라우드 콘솔)에서 발급한 키 — 2026-07-31 이후 신규 발급은 이것만 가능
#   legacy : developers.naver.com 에서 기존에 받은 키 (2027-06-30까지 사용 가능)
#   hub_url 경로는 3rd-party 문서 기준이라, 첫 실행에서 404가 나면 콘솔의 API 문서 경로로 고쳐 주세요.
naver_api:
  mode: hub
  hub_url: "https://naverapihub.apigw.ntruss.com/search-trend/v1/search"
  legacy_url: "https://openapi.naver.com/v1/datalab/search"

nowcast:
  direction_threshold: 0.03      # QoQ ±3% 이내면 NEUTRAL
  min_obs_for_beta: 4            # 탄력성(beta) 추정에 필요한 최소 분기 수. 미달 시 beta=1 (가정치로 표시)

companies:
  # ---------------------------------------------------------------------------
  enkeyax:
    name: "엔키AX"
    stock_code: "134580"
    enabled: true
    # 합병 등 구조적 단절. 국내 모델 백테스트는 이 분기 '다음' 분기부터 (QoQ 비교 때문)
    #   탑툰 흡수합병 완료: 2025-04-01 → 2Q25가 첫 온전한 합병 분기
    structural_breaks:
      domestic_first_full_quarter: "2025Q2"
      # 일본: 유통(외부 플랫폼) 중심 → 자체 플랫폼(탑툰재팬) 중심 전환. 더미 처리
      overseas_regime_change: "2025Q1"
    # 해외 매출 비중 기본값 (부문 데이터 확보 전 임시). 출처: 아시아경제 2025-10-28
    #   독립리서치 아리스 "일본 비중 전체 매출의 30~40%" → 중간값 35%
    default_overseas_share: 0.35

    naver_datalab:               # 한국 검색량 → 국내 모델
      groups:
        - {name: "탑툰", keywords: ["탑툰", "toptoon"]}
        - {name: "탑툰챗", keywords: ["탑툰챗", "탑툰 챗", "탑툰 AI"]}
      # 동종사 비교용 (같은 요청 안에 넣어야 같은 스케일로 비교 가능, 최대 5그룹)
      peer_groups:
        - {name: "봄툰", keywords: ["봄툰"]}
        - {name: "레진코믹스", keywords: ["레진코믹스", "레진"]}

    google_trends:               # 보조 소스 (실패해도 파이프라인 계속)
      keywords: ["toptoon", "トップトゥーン"]
      geos: ["JP", "TW", "US"]

    fx_pairs: ["JPYKRW", "TWDKRW", "USDKRW"]

    # 도메인 → 국내/해외 매핑. Similarweb 수동입력·Tranco 순위에 사용
    domains:
      # Similarweb 무료판은 하위 도메인을 루트에 합산 → toptoon.com 에 chat.toptoon.com·chat.global.toptoon.com 포함
      #   그래서 한국 비중(kr_share)으로 국내/해외를 나눈다
      - {domain: "toptoon.com",       region: "split"}
      - {domain: "chat.toptoon.com",  region: "domestic"}  # 탑툰챗은 국가별 별도 도메인 운영 (2026-11 확인)
      - {domain: "toptoon.jp",        region: "overseas", fx: "JPYKRW"}
      - {domain: "chat.toptoon.jp",   region: "overseas", fx: "JPYKRW"}
      - {domain: "toptoon.net",       region: "overseas", fx: "TWDKRW"}   # 대만 (chat.toptoon.net 기준 추정, 확인 필요)
      - {domain: "chat.toptoon.net",  region: "overseas", fx: "TWDKRW"}
      - {domain: "toptoonplus.com",   region: "overseas", fx: "USDKRW"}
      - {domain: "chat.global.toptoon.com", region: "overseas", fx: "USDKRW"}

    # 공개 페이지 변경 감시 (이벤트 노이즈·신작 감지). 텍스트/링크만 저장
    page_watch:
      - {id: "kr_event",    url: "https://toptoon.com/event",              region: "domestic", kind: "event"}
      - {id: "kr_sale",     url: "https://toptoon.com/event/freetoon/daily", region: "domestic", kind: "event"}
      - {id: "kr_new",      url: "https://toptoon.com/complete",           region: "domestic", kind: "notice"}
      - {id: "chat_home",   url: "https://chat.toptoon.com/",              region: "domestic", kind: "catalog"}
      # toptoon.jp 는 JS 렌더링/인증벽으로 링크 0개 → 제외. 니지GAME 은 정확한 URL 확인 후 추가

    # 랭킹 페이지 기반 지표 (작품별 누적 조회수 → 주간 증분)
    rank_pages:
      - {id: "toptoon_top100", url: "https://toptoon.com/ranking", parser: "toptoon", region: "domestic"}

    # 탑툰챗 국가별 사이트 (작품·캐릭터 카드의 공개 누적 수치 수집)
    chat_sites:
      - {id: "kr",     url: "https://chat.toptoon.com/",        region: "domestic"}
      - {id: "jp",     url: "https://chat.toptoon.jp/",         region: "overseas", fx: "JPYKRW"}
      - {id: "tw",     url: "https://chat.toptoon.net/",        region: "overseas", fx: "TWDKRW"}
      - {id: "global", url: "https://chat.global.toptoon.com/", region: "overseas", fx: "USDKRW"}

    # 탑툰챗 캐릭터 카탈로그 → IP 출처 태깅 (OPM 방향성 경고등)
    #   selector는 실제 페이지 구조 확인 후 입력. 비어 있으면 CONFIG_REQUIRED로 기록
    chat_catalog:
      url: "https://chat.toptoon.com/"
      item_selector: ""
      name_selector: ""
      origin_selector: ""
      ip_rules:                  # 원작명/설명에 포함된 키워드 → IP 출처
        novelpia: ["노벨피아", "novelpia"]
        own: ["탑툰", "toptoon", "탑코"]

    dart:
      # 분기보고서 본문에서 찾을 부문/지역 매출 표 키워드
      segment_keywords: ["플랫폼", "유통", "국내", "일본", "해외", "지역"]
      cost_keywords: ["지급수수료", "외주비", "광고선전비"]

  # ---------------------------------------------------------------------------
  kidari:
    name: "키다리스튜디오"
    stock_code: "020120"
    enabled: true
    # 레진엔터테인먼트는 2021-02 편입 → 백필 구간(2022~)에는 구조 단절 없음
    structural_breaks: {domestic_first_full_quarter: "2022Q1", overseas_regime_change: "2022Q1"}
    default_overseas_share: 0.5     # DART 지역 매출 파싱 전 임시값 (파싱되면 자동 교체)

    naver_datalab:
      groups:
        - {name: "봄툰", keywords: ["봄툰", "bomtoon"]}
        - {name: "레진코믹스", keywords: ["레진코믹스", "레진", "lezhin"]}
        - {name: "티즈", keywords: ["레진 티즈", "티즈 캐릭터챗", "myteaz"]}
      peer_groups:
        - {name: "탑툰", keywords: ["탑툰", "toptoon"]}

    google_trends:
      keywords: ["lezhin", "bomtoon", "beltoon", "ベルトゥーン"]
      geos: ["US", "TW", "JP", "FR"]

    fx_pairs: ["USDKRW", "JPYKRW", "TWDKRW", "EURKRW"]

    # 2026-11-20 브라우저로 확인한 도메인 (델리툰은 lezhinfr.com 으로 리디렉트)
    domains:
      - {domain: "bomtoon.com",  region: "domestic"}
      - {domain: "lezhin.com",   region: "split"}     # 한국어 외 언어 페이지 포함 가능 → 한국 비중 입력
      - {domain: "myteaz.io",    region: "domestic"}  # AI 캐릭터챗 '티즈' (2026-10 출시)
      - {domain: "lezhinus.com", region: "overseas", fx: "USDKRW"}
      - {domain: "beltoon.jp",   region: "overseas", fx: "JPYKRW"}
      - {domain: "bomtoon.tw",   region: "overseas", fx: "TWDKRW"}
      - {domain: "lezhinfr.com", region: "overseas", fx: "EURKRW"}

    page_watch:
      - {id: "lezhin_home", url: "https://www.lezhin.com/ko",          region: "domestic", kind: "notice"}
      - {id: "teaz_home",   url: "https://myteaz.io/ko",               region: "domestic", kind: "catalog"}

    # 랭킹 페이지 기반 지표: 프로모션 강도(EVENT·할인·n화 무료 비중), 자사 IP 비중(제작사 표기)
    rank_pages:
      - {id: "lezhin_rank100", url: "https://www.lezhin.com/ko/ranking", parser: "lezhin", region: "domestic", render: true,
         own_ip_keywords: ["키다리스튜디오"]}
      - {id: "bomtoon_best20", url: "https://www.bomtoon.com/bom/comic/main", parser: "bomtoon", region: "domestic", render: true, max_items: 20,
         own_ip_keywords: []}

    # 티즈: 카드 숫자(종이비행기 아이콘) = 보낸 메시지 수로 추정. JS 렌더링 페이지라 render: true
    chat_sites:
      - {id: "teaz", url: "https://myteaz.io/ko", region: "domestic", render: true,
         paths: ["/ko"], link_pattern: "/chat/r/([A-Za-z0-9]+)", signal_metric: "m1"}

    chat_catalog: {url: "", item_selector: ""}
    dart:
      segment_keywords: ["국내", "해외", "미국", "북미", "일본", "대만", "유럽", "지역", "플랫폼"]
      cost_keywords: ["지급수수료", "광고선전비", "외주비"]

# 업황 체크용 동종사 (DART 분기 매출만 수집)
peers:
  - {name: "미스터블루",   stock_code: "207760"}
  - {name: "디앤씨미디어", stock_code: "263720"}
  - {name: "키다리스튜디오", stock_code: "020120"}
