# 주간 수집 → 대시보드 빌드 → 저장소에 커밋 (GitHub Pages가 docs/를 게시)
name: weekly-collect

on:
  schedule:
    - cron: "37 0 * * 1"      # 매주 월요일 09:37 KST (직전 주 데이터 확정 후)
  workflow_dispatch: {}       # Actions 탭에서 수동 실행
  push:
    paths: ["commentary/**", "data/manual/**", "config.yaml", "templates/**"]

permissions:
  contents: write

concurrency: {group: tracker-data, cancel-in-progress: false}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}          # 트리거 시점 SHA가 아니라 최신 main (앞선 실행의 데이터 커밋 반영)
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt

      - name: Collect (스케줄·수동 실행일 때만 전체 수집)
        if: github.event_name != 'push'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python collector.py

      - name: Merge manual inputs only (push일 때)
        if: github.event_name == 'push'
        run: python collector.py --only manual

      - name: Build dashboard
        env: {GITHUB_REPOSITORY: "${{ github.repository }}"}
        run: python build_dashboard.py

      - name: Commit
        run: |
          git config user.name "tracker-bot"
          git config user.email "tracker-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) weekly update [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
