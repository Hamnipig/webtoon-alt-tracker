<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹툰 기업 실적 트래커</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
.viz-root{
  color-scheme:light;
  --page:#f9f9f7; --surface-1:#fcfcfb; --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4;
  --series-6:#008300; --series-7:#6250d6; --series-8:#e34948;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b; --up:#006300;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])) .viz-root{
    color-scheme:dark;
    --page:#0d0d0d; --surface-1:#1a1a19; --text-primary:#f0efec; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181;
    --series-6:#0ca30c; --series-7:#9085e9; --series-8:#e66767; --up:#0ca30c;
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.viz-root{background:var(--page);color:var(--text-primary);min-height:100vh;padding:20px 24px 60px}
header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:20px;margin:0} h2{font-size:15px;margin:0 0 10px} h3{font-size:13px;margin:0 0 6px;color:var(--text-secondary);font-weight:600}
.meta{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;margin:6px 0 16px}
.tabs button{border:1px solid var(--border);background:var(--surface-1);color:var(--text-primary);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px}
.tabs button.on{border-color:var(--series-1);box-shadow:inset 0 0 0 1px var(--series-1)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:16px}
.c12{grid-column:span 12}.c7{grid-column:span 7}.c5{grid-column:span 5}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}
@media(max-width:1000px){.c8,.c7,.c6,.c5,.c4,.c3{grid-column:span 12!important}}
.tile .v{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:4px}
.tile .s{font-size:12px;color:var(--text-secondary);margin-top:4px}
.up{color:var(--up)} .down{color:var(--critical)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.b-OK::before{background:var(--good)} .b-FAILED::before{background:var(--critical)}
.b-MANUAL_REQUIRED::before{background:var(--warning)} .b-CONFIG_REQUIRED::before{background:var(--serious)}
.b-POSITIVE::before{background:var(--good)} .b-NEGATIVE::before{background:var(--critical)} .b-NEUTRAL::before{background:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
th{color:var(--text-secondary);font-weight:600} td.n,th.n{text-align:right}
.summary li{margin:4px 0;font-size:13.5px;line-height:1.5}
.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
.chartbox{position:relative;height:260px}
.empty{color:var(--muted);font-size:13px;padding:30px 0;text-align:center}
form.inp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end}
form.inp label{font-size:12px;color:var(--text-secondary);display:flex;flex-direction:column;gap:4px}
form.inp input,form.inp select{padding:6px 8px;border:1px solid var(--axis);border-radius:6px;background:var(--surface-1);color:var(--text-primary)}
form.inp button{padding:8px 10px;border-radius:6px;border:0;background:var(--series-1);color:#fff;cursor:pointer}
@media(max-width:1000px){form.inp{grid-template-columns:1fr 1fr}}
.tag{font-size:10.5px;border:1px solid var(--border);border-radius:4px;padding:1px 5px;margin-right:3px;color:var(--text-secondary)}
details summary{cursor:pointer;font-size:12px;color:var(--text-secondary)}
</style>
</head>
<body>
<div class="viz-root">
  <header>
    <h1>웹툰 기업 실적 트래커</h1>
    <span class="meta" id="meta"></span>
  </header>
  <div class="tabs" id="tabs"></div>
  <div id="app"></div>
</div>

<script>
const DATA = /*__DATA__*/null;
const css = n => getComputedStyle(document.querySelector('.viz-root')).getPropertyValue(n).trim();
const SLOT = i => css(`--series-${(i % 8) + 1}`);
const pct = (x, d=1) => x == null ? 'N/A' : `${x > 0 ? '+' : ''}${(x * 100).toFixed(d)}%`;
const pl = (x, d=1) => x == null ? '–' : `${(x * 100).toFixed(d)}%`;
const eok = x => x == null ? '–' : `${(x / 1e8).toLocaleString('ko-KR', {maximumFractionDigits: 0})}억`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let charts = [];

function lineChart(el, seriesMap, {yTitle='', reverse=false, dashedKeys=[], fmt=null}={}) {
  const keys = Object.keys(seriesMap);
  if (!keys.length) { el.innerHTML = '<div class="empty">아직 데이터 없음</div>'; return; }
  const labels = [...new Set(keys.flatMap(k => seriesMap[k].map(p => p[0])))].sort();
  const datasets = keys.map((k, i) => {
    const m = new Map(seriesMap[k]);
    return {label: k, data: labels.map(l => m.has(l) ? m.get(l) : null), borderColor: SLOT(i),
            backgroundColor: SLOT(i), borderWidth: 2, pointRadius: 0, pointHoverRadius: 4,
            spanGaps: true, tension: 0.15, borderDash: dashedKeys.includes(k) ? [5, 4] : []};
  });
  const cv = document.createElement('canvas'); el.innerHTML = ''; el.appendChild(cv);
  charts.push(new Chart(cv, {type: 'line', data: {labels, datasets}, options: baseOpts({yTitle, reverse, fmt})}));
}

function baseOpts({yTitle='', reverse=false, fmt=null, stacked=false}={}) {
  return {
    responsive: true, maintainAspectRatio: false, animation: false,
    interaction: {mode: 'index', intersect: false},
    plugins: {
      legend: {position: 'top', align: 'start', labels: {boxWidth: 10, boxHeight: 10, color: css('--text-secondary'), font: {size: 11}}},
      tooltip: {callbacks: fmt ? {label: c => `${c.dataset.label}: ${fmt(c.parsed.y)}`} : {}},
    },
    scales: {
      x: {stacked, ticks: {color: css('--muted'), maxTicksLimit: 10, font: {size: 10}}, grid: {display: false}, border: {color: css('--axis')}},
      y: {stacked, reverse, title: {display: !!yTitle, text: yTitle, color: css('--muted'), font: {size: 10}},
          ticks: {color: css('--muted'), font: {size: 10}, callback: fmt || undefined},
          grid: {color: css('--grid')}, border: {display: false}},
    },
  };
}

function barChart(el, labels, datasets, opts={}) {
  if (!labels.length) { el.innerHTML = '<div class="empty">아직 데이터 없음</div>'; return; }
  const cv = document.createElement('canvas'); el.innerHTML = ''; el.appendChild(cv);
  datasets.forEach((d, i) => Object.assign(d, {borderRadius: 4, borderSkipped: 'start', borderWidth: 0,
    backgroundColor: d.backgroundColor || SLOT(i), maxBarThickness: 28}));
  charts.push(new Chart(cv, {type: 'bar', data: {labels, datasets}, options: baseOpts(opts)}));
}

function tile(title, value, sub, cls='') {
  return `<div class="card tile c3"><h3>${title}</h3><div class="v ${cls}">${value}</div><div class="s">${sub}</div></div>`;
}

function render(co) {
  charts.forEach(c => c.destroy()); charts = [];
  const nc = co.nowcast;
  const app = document.getElementById('app');
  const sign = x => x == null ? '' : x > 0 ? 'up' : x < 0 ? 'down' : '';

  // ---------- 요약 / 코멘터리
  const cm = co.commentary;
  const llm = cm && !cm._stale ? `
      <h3>주간 애널리스트 코멘터리 (${esc(cm.as_of_date)} · LLM)</h3>
      <span class="badge b-${esc(cm.dashboard_commentary?.qoq_revenue_signal)}">${esc(cm.dashboard_commentary?.qoq_revenue_signal)}</span>
      <ul class="summary">${(cm.dashboard_commentary?.key_takeaways || []).map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      <div class="note"><b>노이즈 점검</b> ${esc(cm.metrics_collected?.event_noise_check?.promo_summary || '–')}<br>
      <b>IP 믹스</b> ${esc(cm.metrics_collected?.ip_mix_note || '–')}<br>
      <b>주의</b> ${esc(cm.dashboard_commentary?.analyst_caution || '–')}</div>` :
      `<h3>자동 요약 (규칙 기반${cm ? ' · LLM 코멘터리가 10일 이상 지나 숨김' : ''})</h3>`;
  const kw = Object.entries(nc.wow || {});

  const pv = co.preview || {};
  const sc = co.scorecard || [];
  const adopted = sc.filter(c => c.status === '채택');
  const failed = sc.filter(c => c.status === '검증 미달');
  const waiting = sc.filter(c => c.status.startsWith('검증 대기'));
  const iss = co.issues || [];
  const nIss = lv => iss.filter(i => i.level === lv).length;
  const v = co.valuation;
  const k = co.kpis || [];
  const lastK = k[k.length - 1] || {};
  const seas = pv.seasonal || {};
  const n1 = x => x == null ? '–' : Number(x).toFixed(1);
  const costKeys = [...new Set(k.flatMap(r => Object.keys(r).filter(x => x.startsWith('cost_'))))];

  app.innerHTML = `
  <div class="grid">
    <div class="card c8">
      <h2>${esc(pv.target_quarter || '')} 매출 프리뷰 <span class="meta">· 다음 정기보고서 예상 ${esc(pv.next_filing || '–')} (작년 같은 분기 제출일 기준)</span></h2>
      <div style="display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end">
        <div><div class="meta">추정 매출</div><div style="font-size:34px;font-weight:700">${eok(pv.estimate)}</div>
          <div class="meta">범위 ${eok(pv.low)} ~ ${eok(pv.high)} (기준선 과거 평균오차 ±${pv.band_pct != null ? (pv.band_pct*100).toFixed(1) : '–'}%, n=${pv.band_n || 0})</div></div>
        <div><div class="meta">직전 분기 ${esc(pv.last_quarter || '')}</div><div style="font-size:20px;font-weight:650">${eok(pv.last_revenue)}</div>
          <div class="meta">QoQ <span class="${sign(lastK.rev_qoq)}">${pct(lastK.rev_qoq)}</span> · YoY <span class="${sign(lastK.rev_yoy)}">${pct(lastK.rev_yoy)}</span> · OPM ${pl(lastK.opm)}</div></div>
        <div><div class="meta">추정치의 전년 동기 대비</div><div style="font-size:20px;font-weight:650" class="${sign(pv.implied_yoy)}">${pct(pv.implied_yoy)}</div>
          <div class="meta">비교 ${eok(pv.yoy_base)}</div></div>
      </div>
      <ul class="summary" style="margin-top:12px">
        <li><b>추정 방법</b> ${esc(pv.method || '')}. ${pv.validated ? '' : '검증 기준을 통과한 대체데이터 지표가 아직 없어, 매출을 가장 잘 맞혀 온 단순 기준선(직전 분기 유지)을 그대로 씁니다.'}</li>
        <li><b>계절성 참고</b> 과거 ${seas.n || 0}개 같은 분기 QoQ: ${seas.up || 0}회 상승, 중앙값 ${pct(seas.median)} ${seas.history && seas.history.length ? '(' + seas.history.map(h => h[0] + ' ' + pct(h[1])).join(', ') + ')' : ''}</li>
        <li><b>대체데이터 원신호</b> QTD 합산 ${pct(pv.raw_alt_signal)} (${esc(pv.raw_alt_direction || '')}) — 검증 미통과 지표 포함, 추정치에는 반영하지 않음</li>
      </ul>
      ${cm && !cm._stale ? llm : ''}
    </div>

    <div class="card c4">
      <h2>밸류에이션 (TTM)</h2>
      ${v ? `<table>
        <tr><td>주가 (${esc(v.price_date)})</td><td class="n">${Number(v.price).toLocaleString()}원</td></tr>
        <tr><td>시가총액</td><td class="n">${eok(v.mcap)}</td></tr>
        <tr><td>TTM 매출 / 영업이익 / 순이익 (~${esc(v.ttm_through)})</td><td class="n">${eok(v.ttm_revenue)} / ${eok(v.ttm_op)} / ${eok(v.ttm_ni)}</td></tr>
        <tr><td>PSR</td><td class="n">${n1(v.psr)}배</td></tr>
        <tr><td>시총/영업이익</td><td class="n">${n1(v.por)}배</td></tr>
        <tr><td>PER</td><td class="n">${n1(v.per)}배</td></tr></table>
        <div class="note">발행주식수(DART) × 종가(네이버 금융). 자기주식 미차감.</div>` : '<div class="empty">다음 수집부터 표시</div>'}
      <h2 style="margin-top:16px">동종사 최근 분기</h2>
      <table><tr><th>기업</th><th>분기</th><th class="n">매출</th><th class="n">YoY</th><th class="n">OPM</th></tr>
      ${(DATA.peer_table||[]).map(p => `<tr><td>${esc(p.name)}</td><td>${esc(p.quarter)}</td><td class="n">${eok(p.revenue)}</td><td class="n ${sign(p.yoy)}">${pct(p.yoy)}</td><td class="n">${pl(p.opm)}</td></tr>`).join('')}
      </table>
    </div>

    <div class="card c12"><h2>분기 실적 요약 (DART, 분기 단독)</h2>
      <table><tr><th>분기</th><th class="n">매출</th><th class="n">QoQ</th><th class="n">YoY</th><th class="n">영업이익</th><th class="n">OPM</th>
        <th class="n">국내</th><th class="n">국내 YoY</th><th class="n">해외</th><th class="n">해외 YoY</th>
        ${costKeys.map(c => `<th class="n">${esc(c.slice(5))}/매출</th>`).join('')}</tr>
      ${k.slice().reverse().map(r => `<tr><td>${r.quarter}${r.region_suspect ? ' <span title="지역 매출 정합성 경고">⚠</span>' : ''}</td>
        <td class="n">${eok(r.revenue)}</td><td class="n ${sign(r.rev_qoq)}">${pct(r.rev_qoq)}</td><td class="n ${sign(r.rev_yoy)}">${pct(r.rev_yoy)}</td>
        <td class="n">${eok(r.op)}</td><td class="n">${pl(r.opm)}</td>
        <td class="n">${eok(r.domestic)}</td><td class="n ${sign(r.dom_yoy)}">${r.region_suspect ? '⚠ ' : ''}${pct(r.dom_yoy)}</td>
        <td class="n">${eok(r.overseas)}</td><td class="n ${sign(r.ovs_yoy)}">${r.region_suspect ? '⚠ ' : ''}${pct(r.ovs_yoy)}</td>
        ${costKeys.map(c => `<td class="n">${pl(r[c])}</td>`).join('')}</tr>`).join('')}
      </table>
      <div class="note">합병 전 분기와 비교하는 전년 대비(YoY)는 표시하지 않습니다. ⚠ 표시가 있는 분기의 국내/해외 값은 공시 분류 문제로 추세 판단에서 제외하세요. 비용 비율은 파싱 이상치를 뺀 값입니다.</div></div>

    <div class="card c7"><h2>대체데이터 지표 스코어카드 <span class="meta">· 분기 QoQ 기준, 채택 기준 n≥${co.gate.n} · 방향 적중≥${co.gate.hit*100}% · 상관≥${co.gate.corr}</span></h2>
      <table><tr><th>지표</th><th>대상</th><th class="n">n</th><th class="n">상관</th><th class="n">방향 적중</th><th>판정</th></tr>
      ${[...adopted, ...failed].map(c => `<tr><td>${esc(c.indicator)}</td><td class="meta">${esc(c.target)}</td><td class="n">${c.n}</td>
        <td class="n">${c.corr == null ? '–' : c.corr.toFixed(2)}</td><td class="n">${c.hit == null ? '–' : (c.hit*100).toFixed(0) + '%'}</td>
        <td><span class="badge b-${c.status === '채택' ? 'OK' : 'FAILED'}">${esc(c.status)}</span></td></tr>`).join('')}
      </table>
      <div class="note">검증 대기 ${waiting.length}개: ${waiting.map(c => esc(c.indicator)).join(', ')} — 탑툰챗·티즈 활동량과 Similarweb은 이력이 쌓이면 자동으로 평가됩니다(최소 ${co.gate.n}개 분기 QoQ 필요).</div></div>

    <div class="card c5"><h2>정합성 점검 <span class="meta">· 경고 ${nIss('경고')} · 주의 ${nIss('주의')} · 수집 ${nIss('수집')}</span></h2>
      <table>${iss.map(i => `<tr><td><span class="badge b-${i.level === '경고' ? 'FAILED' : i.level === '주의' ? 'MANUAL_REQUIRED' : 'CONFIG_REQUIRED'}">${esc(i.level)}</span></td><td>${esc(i.item)}</td><td class="meta">${esc(i.detail)}</td></tr>`).join('') || '<tr><td class="empty">이상 없음</td></tr>'}</table>
      <details style="margin-top:8px"><summary>수집 소스별 상태</summary><table>
      ${co.status.map(s => `<tr><td>${esc(s.source)}</td><td><span class="badge b-${s.status}">${s.status}</span></td><td class="meta">${esc((s.run_at||'').slice(0,10))} ${esc((s.message||'').slice(0,80))}</td></tr>`).join('')}
      </table></details></div>

    <div class="card c12"><h2>원자료 · 주간 검색량 (네이버 데이터랩, 한국) <span class="meta">· 스코어카드상 매출 설명력 낮음</span></h2>
      <div class="meta" style="margin-bottom:6px">${kw.map(([k,v]) => `${esc(k)}: 최근주 ${v.last.toFixed(1)} · WoW <span class="${sign(v.wow)}">${pct(v.wow)}</span> · 4주 <span class="${sign(v.m4)}">${pct(v.m4)}</span>`).join(' &nbsp;|&nbsp; ')}</div>
      <div class="chartbox" id="ch-naver"></div>
      <div class="note">점선 = 동종사. 지수는 요청 구간 내 최댓값=100 기준이라 매주 전체 구간을 다시 받아 덮어씁니다.</div></div>

    <div class="card c6"><h2>해외 검색 지수 (Google Trends, 보조)</h2><div class="chartbox" id="ch-gt"></div></div>
    <div class="card c6"><h2>월간 방문 수 (Similarweb, 수동 입력)</h2><div class="chartbox" id="ch-sw"></div></div>
    <div class="card c6"><h2>환율 지수 (3년 전=100)</h2><div class="chartbox" id="ch-fx"></div>
      <div class="note">원화 환산 효과. 지수가 오르면 해당 통화 매출의 원화 환산액이 늘어납니다.</div></div>
    <div class="card c6"><h2>Tranco 도메인 순위 (낮을수록 상위)</h2><div class="chartbox" id="ch-tr"></div></div>

    <div class="card c8"><h2>분기 매출 추이 (DART, 분기 단독) + 프리뷰 추정</h2><div class="chartbox" id="ch-fin"></div>
      <div class="note">4분기 = 사업보고서 연간 − 3분기 누적. 마지막 막대(연한 색)는 프리뷰 추정치이며, 범위는 상단 프리뷰를 참고하세요.</div></div>
    <div class="card c4"><h2>영업이익률</h2><div class="chartbox" id="ch-opm"></div></div>

    <div class="card c6"><h2>국내/해외 분기 매출 (DART 주석, 누적 차감)</h2><div class="chartbox" id="ch-region"></div>
      <div class="note">국내·해외 매출은 연결 주석의 연초 누적값에서 직전 보고서 누적을 빼 만든 분기 단독값입니다. 회색(⚠) 분기는 공시 분류가 앞뒤 분기와 맞지 않아 추세 판단에서 제외하세요.</div></div>
    <div class="card c6"><h2>비용 / 매출 (지급수수료 · 광고선전비)</h2><div class="chartbox" id="ch-cost"></div>
      <div class="note">지급수수료에는 플랫폼·결제 수수료, 외부 IP 로열티, AI 추론 비용이 섞여 있을 수 있습니다. 탑툰챗 IP 믹스와 함께 보세요.</div></div>

    <div class="card c12"><h2>탑툰챗 국가별 주간 신규 대화 수 (캐릭터 카드 말풍선 수치 증분)</h2><div class="chartbox" id="ch-chat"></div>
      <div class="note">지난주와 이번 주에 모두 노출된 작품만 비교해서 신규 작품 진입 효과를 뺐습니다. 수치는 '25만' 같은 반올림 표기라 작은 증분은 0으로 보일 수 있습니다.
      두 번째 주부터 값이 생깁니다.</div></div>

    <div class="card c6"><h2>원신호 백테스트 (검증 전 합산 신호 vs 실제 매출 QoQ)</h2>
      <table><tr><th>분기</th><th>모델</th><th class="n">신호</th><th class="n">실제</th><th>방향</th></tr>
      ${(nc.backtest||[]).slice().reverse().map(r => `<tr><td>${r.quarter}</td><td class="meta">${r.model === 'total' ? '합산' : '해외 대리('+r.regime+')'}</td>
        <td class="n">${pct(r.g_signal)}</td><td class="n">${pct(r.actual_qoq)}</td>
        <td>${r.g_signal == null ? '–' : Math.sign(r.g_signal) === Math.sign(r.actual_qoq) ? '적중' : '불일치'}</td></tr>`).join('') || '<tr><td colspan=5 class="empty">실적·신호 데이터 축적 전</td></tr>'}
      </table>
      <div class="note">합산 모델(${nc.dom_backtest_start}~): 적중 ${fmtHit(nc.backtest_stats.total_post_merger)} ·
        해외 대리(유통 중심기): ${fmtHit(nc.backtest_stats.overseas_proxy_pre_regime)} · 해외 대리(플랫폼 전환 후): ${fmtHit(nc.backtest_stats.overseas_proxy_post_regime)}<br>
        국내 신호 vs 국내 매출: ${fmtHit(nc.backtest_stats.domestic_region)} · 해외 신호 vs 해외 매출: ${fmtHit(nc.backtest_stats.overseas_region)}<br>
        LOO 평균오차(QoQ) ${pct(nc.backtest_stats.loo_mae_qoq)} · 표본이 작아 적중률은 검증이 아니라 모니터링 지표입니다.</div></div>

    <div class="card c6"><h2>탑툰챗 IP 출처 비중 (OPM 방향성 경고등)</h2><div class="chartbox" id="ch-ip"></div>
      <div class="note">카탈로그 기준 비중이며 매출 비중이 아닙니다. 외부 IP(노벨피아 등) 비중이 오르면 지급수수료 계정 변동을 함께 확인하세요.
      ${nc.event_elasticity ? `<br>프로모션 주간 검색 탄력성: ${pct(nc.event_elasticity.avg_uplift)} (n=${nc.event_elasticity.n})` : ''}</div></div>

    <div class="card c6"><h2>감지된 이벤트 (공개 페이지 변경)</h2>
      <table><tr><th>감지일</th><th>내용</th><th>태그</th></tr>
      ${co.events.slice(0, 15).map(e => `<tr><td class="meta">${e.detected_on}</td><td><a href="${esc(e.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(e.title)}</a><div class="meta">${esc(e.page_id)}</div></td><td>${e.tags.map(t => `<span class="tag">${t}</span>`).join('')}</td></tr>`).join('') || '<tr><td colspan=3 class="empty">첫 실행은 기준선만 저장합니다</td></tr>'}
      </table></div>

    <div class="card c6"><h2>부문·지역·비용 (DART 확인값)</h2>
      <table><tr><th>분기</th><th>구분</th><th>항목</th><th class="n">금액</th><th>근거</th></tr>
      ${co.segments.slice(-20).map(s => `<tr><td>${s.quarter}</td><td>${s.scope}</td><td>${esc(s.account)}</td><td class="n">${eok(s.value)}</td><td class="meta">${esc(s.basis)}</td></tr>`).join('') || '<tr><td colspan=5 class="empty">data/review/ 의 후보 표 확인 후 segments.csv에 입력</td></tr>'}
      </table></div>

    <div class="card c12"><h2>Similarweb 월간 입력</h2>
      <form class="inp" id="swform" onsubmit="return submitSW(event)">
        <label>월 <input name="month" type="month" required></label>
        <label>도메인 <select name="domain">${co.domains.map(d => `<option>${esc(d)}</option>`).join('')}</select></label>
        <label>월 방문 수 <input name="visits" type="number" min="0" required></label>
        <label>평균 체류(초) <input name="avg_duration_sec" type="number" min="0"></label>
        <label>한국 비중(0~1) <input name="kr_share" type="number" step="0.001" min="0" max="1"></label>
        <button type="submit">GitHub Issue로 제출</button>
      </form>
      <div class="note">제출하면 GitHub Issue가 열리고, Actions가 내용을 data/manual/similarweb.csv에 반영한 뒤 Issue를 자동으로 닫습니다.
        같은 월·도메인을 다시 넣으면 덮어씁니다. 수치를 못 봤으면 빈칸으로 두고 넘어가세요(추정치 입력 금지).
        <span id="csvrow"></span></div></div>

    <div class="card c12"><details><summary>표로 보기: 분기 실적 원자료</summary>
      <table><tr><th>분기</th><th class="n">매출</th><th class="n">영업이익</th><th class="n">순이익</th><th class="n">OPM</th><th>근거</th></tr>
      ${co.financials.map(f => `<tr><td>${f.quarter}</td><td class="n">${eok(f.revenue)}</td><td class="n">${eok(f.operating_income)}</td><td class="n">${eok(f.net_income)}</td><td class="n">${f.revenue ? pct(f.operating_income / f.revenue) : '–'}</td><td class="meta">${esc(f.basis)}</td></tr>`).join('')}
      </table></details></div>
  </div>`;

  // ---------- 차트
  const peerKeys = Object.keys(co.naver).filter(k => !co.own_groups.includes(k));
  lineChart(document.getElementById('ch-naver'), co.naver, {yTitle: '지수', dashedKeys: peerKeys});
  lineChart(document.getElementById('ch-gt'), co.gtrends, {yTitle: '지수'});
  const swMax = Math.max(0, ...Object.values(co.similarweb).map(v => v.points.length));
  if (swMax >= 3) {
    lineChart(document.getElementById('ch-sw'), Object.fromEntries(Object.entries(co.similarweb).map(([k, v]) => [k, v.points])),
              {fmt: v => v >= 1e6 ? (v/1e6).toFixed(1)+'M' : v >= 1e3 ? (v/1e3).toFixed(0)+'K' : v});
  } else {
    const ent = Object.entries(co.similarweb);
    document.getElementById('ch-sw').innerHTML = ent.length ? `<table><tr><th>도메인</th><th>월</th><th class="n">방문</th><th class="n">체류(초)</th><th class="n">한국 비중</th></tr>
      ${ent.map(([d, v]) => v.points.map(p => `<tr><td>${esc(d)}</td><td>${p[0].slice(0,7)}</td><td class="n">${Number(p[1]).toLocaleString()}</td>
        <td class="n">${(v.duration.find(x => x[0] === p[0]) || [,'–'])[1]}</td><td class="n">${pl((v.kr_share.find(x => x[0] === p[0]) || [,null])[1])}</td></tr>`).join('')).join('')}</table>
      <div class="note">3개월 이상 쌓이면 추이 차트로 바뀝니다.</div>` : '<div class="empty">아직 입력 없음 — 하단 입력 폼 사용</div>';
  }
  lineChart(document.getElementById('ch-fx'), co.fx, {fmt: v => Number(v).toFixed(0)});
  lineChart(document.getElementById('ch-tr'), co.tranco, {reverse: true, fmt: v => Number(v).toLocaleString()});

  const fin = co.financials.slice(-12);
  const labels = fin.map(f => f.quarter);
  const revData = fin.map(f => f.revenue != null ? f.revenue / 1e8 : null);
  const colors = fin.map(() => SLOT(0));
  if (pv.estimate && !labels.includes(pv.target_quarter)) {
    labels.push(pv.target_quarter + ' (E)'); revData.push(pv.estimate / 1e8); colors.push(SLOT(0) + '55');
  }
  barChart(document.getElementById('ch-fin'), labels,
           [{label: '매출(억원)', data: revData, backgroundColor: colors}], {fmt: v => Number(v).toFixed(0)});
  const opm = Object.entries(nc.opm || {}).slice(-12);
  lineChart(document.getElementById('ch-opm'), {'OPM': opm}, {fmt: v => (v*100).toFixed(0)+'%'});

  const rq = [...new Set([...(co.region.domestic||[]), ...(co.region.overseas||[])].map(p => p[0]))].sort().slice(-12);
  const rm = k => new Map(co.region[k] || []);
  const susQ = new Set((co.region.domestic_suspect || []).map(p => p[0]));
  barChart(document.getElementById('ch-region'), rq.map(q => susQ.has(q) ? q + ' ⚠' : q), [
    {label: '국내(억원)', data: rq.map(q => rm('domestic').has(q) ? rm('domestic').get(q) / 1e8 : null),
     backgroundColor: rq.map(q => susQ.has(q) ? css('--axis') : SLOT(0))},
    {label: '해외(억원)', data: rq.map(q => rm('overseas').has(q) ? rm('overseas').get(q) / 1e8 : null),
     backgroundColor: rq.map(q => susQ.has(q) ? css('--grid') : SLOT(1))},
  ], {fmt: v => Number(v).toFixed(0)});
  lineChart(document.getElementById('ch-cost'), co.cost_ratio || {}, {fmt: v => (v*100).toFixed(0)+'%'});
  lineChart(document.getElementById('ch-chat'), (co.chat || {})['주간 증분'] || {}, {fmt: v => v >= 1e4 ? (v/1e4).toFixed(1)+'만' : Number(v).toFixed(0)});

  const ip = co.ip_mix, ipKeys = Object.keys(ip);
  if (ipKeys.length) {
    const lab = [...new Set(ipKeys.flatMap(k => ip[k].map(p => p[0])))].sort();
    barChart(document.getElementById('ch-ip'), lab, ipKeys.map(k => {const m = new Map(ip[k]); return {label: k, data: lab.map(l => m.get(l) ?? 0)};}),
             {stacked: true, fmt: v => (v*100).toFixed(0)+'%'});
  } else document.getElementById('ch-ip').innerHTML = '<div class="empty">config.yaml의 chat_catalog selector 설정 후 수집됩니다</div>';
}

function fmtHit(s) { return s && s.n ? `${(s.hit_ratio*100).toFixed(0)}% (n=${s.n})` : 'n=0'; }

function submitSW(ev) {
  ev.preventDefault();
  const f = Object.fromEntries(new FormData(ev.target).entries());
  const co = DATA.companies[current];
  const row = [co.id, f.month, f.domain, f.visits, f.avg_duration_sec || '', f.kr_share || ''].join(',');
  document.getElementById('csvrow').innerHTML = `<br>CSV 행(직접 커밋할 때): <code>${esc(row)}</code>`;
  if (!DATA.repo) { alert('저장소 정보가 없어 Issue를 열 수 없습니다. 아래 CSV 행을 data/manual/similarweb.csv에 추가하세요.'); return false; }
  const q = new URLSearchParams({template: 'similarweb.yml', title: `[similarweb] ${co.id} ${f.month} ${f.domain}`,
    company: co.id, month: f.month, domain: f.domain, visits: f.visits, avg_duration_sec: f.avg_duration_sec || '', kr_share: f.kr_share || ''});
  window.open(`https://github.com/${DATA.repo}/issues/new?${q}`, '_blank');
  return false;
}

let current = 0;
function init() {
  if (!DATA || !DATA.companies.length) { document.getElementById('app').innerHTML = '<div class="empty">데이터 없음</div>'; return; }
  document.getElementById('meta').textContent = `기준일 ${DATA.as_of} · 생성 ${DATA.generated_at}`;
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = DATA.companies.map((c, i) => `<button data-i="${i}" class="${i===0?'on':''}">${esc(c.name)} (${c.stock_code})</button>`).join('');
  tabs.onclick = e => { const b = e.target.closest('button'); if (!b) return; current = +b.dataset.i;
    [...tabs.children].forEach(x => x.classList.toggle('on', x === b)); render(DATA.companies[current]); };
  render(DATA.companies[0]);
}
init();
</script>
</body>
</html>
